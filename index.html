<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Demo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: white;
}

header {
    height: 70px;
    background: #161b22;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    border-bottom: 1px solid #30363d;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.demo {
    color: #f0b90b;
}

.balance {
    font-size: 18px;
}

.container {
    display: grid;
    grid-template-columns: 1fr 300px;
    height: calc(100vh - 70px);
}

.chart {
    padding: 15px;
}

.chart-box {
    width: 100%;
    height: 100%;
    background: #131922;
    border-radius: 10px;
    overflow: hidden;
}

.panel {
    background: #161b22;
    padding: 20px;
    border-left: 1px solid #30363d;
}

.asset {
    font-size: 22px;
    margin-bottom: 25px;
}

.label {
    color: #8b949e;
    margin-top: 15px;
    margin-bottom: 7px;
}

input, select {
    width: 100%;
    padding: 13px;
    background: #0d1117;
    color: white;
    border: 1px solid #30363d;
    border-radius: 7px;
    font-size: 16px;
}

.payout {
    margin: 20px 0;
    font-size: 18px;
}

.up, .down {
    width: 100%;
    border: 0;
    padding: 17px;
    margin-top: 12px;
    border-radius: 8px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.up {
    background: #16a34a;
}

.down {
    background: #dc2626;
}

.notice {
    margin-top: 25px;
    font-size: 12px;
    color: #8b949e;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <div class="logo">
        TRADE <span class="demo">DEMO</span>
    </div>

    <div class="balance">
        DEMO BALANCE:
        <strong>$10,000.00</strong>
    </div>
</header>

<div class="container">

<div class="chart">
    <div class="chart-box">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
            <div class="tradingview-widget-container__widget"
                 style="height:100%;width:100%"></div>

            <script type="text/javascript"
              src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
              async>
            {
              "autosize": true,
              "symbol": "BINANCE:BTCUSDT",
              "interval": "1",
              "timezone": "Etc/UTC",
              "theme": "dark",
              "style": "1",
              "locale": "uk",
              "allow_symbol_change": true,
              "calendar": false,
              "support_host": "https://www.tradingview.com"
            }
            </script>
        </div>
    </div>
</div>

<div class="panel">

    <div class="asset">
        ₿ BTC / USDT
    </div>

    <div class="label">Час угоди</div>

    <select>
        <option>1 хвилина</option>
        <option>3 хвилини</option>
        <option>5 хвилин</option>
    </select>

    <div class="label">Сума</div>

    <input type="number" value="10">

    <div class="payout">
        Виплата: <strong>+90%</strong>
    </div>

    <button class="up">
        ↑ ВГОРУ
    </button>

    <button class="down">
        ↓ ВНИЗ
    </button>

    <div class="notice">
        DEMO — угоди не використовують реальні гроші
    </div>

</div>

</div>

</body>
</html>
